<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 812" width="1000" height="812" font-family="Inter, -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif" role="img" aria-label="Network layout of the home media server">
<defs>
<marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#9ca3af"/></marker>
<marker id="arra" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#2563eb"/></marker>
</defs>
<rect width="1000" height="812" fill="#ffffff"/>
<text x="20" y="32" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Network layout: one forwarded port, two isolated Docker networks</text>
<rect x="20" y="48" width="960" height="112" rx="8" fill="#f9fafb" stroke="#9ca3af" stroke-width="1.25"/>
<text x="36" y="70" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Internet</text>

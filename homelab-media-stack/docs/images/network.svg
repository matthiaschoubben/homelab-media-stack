<text x="66" y="100" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Friend's smart TV</text>
<text x="66" y="120" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Jellyfin app, no VPN client</text>
<rect x="390" y="76" width="220" height="58" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="406" y="100" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">DuckDNS</text>
<text x="406" y="120" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">hostname → current public IP</text>
<rect x="710" y="76" width="240" height="58" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="726" y="100" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">My phone / laptop</text>
<text x="726" y="120" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Tailscale client (WireGuard)</text>
<path d="M270 105 H388" fill="none" stroke="#9ca3af" stroke-width="1.5" marker-end="url(#arr)"/>
<text x="329" y="98" font-size="11.5" font-weight="400" fill="#4b5563" text-anchor="middle">DNS lookup</text>
<rect x="20" y="180" width="960" height="44" rx="8" fill="#fff7ed" stroke="#fdba74" stroke-width="1.25"/>
<text x="190" y="207" font-size="12.5" font-weight="500" fill="#9a3412" text-anchor="start">Proximus network · inbound 23, 80, 443, 8080, 8443 blocked by default · 44300 passes</text>
<rect x="20" y="244" width="960" height="548" rx="8" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.25"/>
<text x="184" y="266" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Home LAN · 192.168.128.0/23</text>
<rect x="40" y="280" width="280" height="76" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="56" y="304" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Proximus Internet Box</text>
<text x="56" y="324" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">192.168.128.1 · public IPv4 · NAT</text>
<text x="56" y="342" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">DHCP · UPnP: TCP 44300 → server</text>
<rect x="40" y="404" width="280" height="58" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="56" y="428" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Room router</text>
<text x="56" y="448" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">bridge / access point only</text>
<rect x="350" y="280" width="610" height="492" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="366" y="302" font-size="13" font-weight="600" fill="#1f2937" text-anchor="start">Server · Intel N95 · Docker host</text>
<rect x="370" y="404" width="180" height="58" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="386" y="428" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">enp1s0</text>
<text x="386" y="448" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">LAN IP via DHCP</text>
<rect x="740" y="316" width="180" height="58" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="756" y="340" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">tailscale0</text>
<text x="756" y="360" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">100.x.x.x</text>
<rect x="370" y="488" width="180" height="76" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="386" y="512" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">iptables</text>
<text x="386" y="532" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">DOCKER-USER chain</text>
<text x="386" y="550" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">fail2ban bans here</text>
<rect x="370" y="580" width="300" height="172" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.25"/>
<text x="416" y="602" font-size="12.5" font-weight="600" fill="#1f2937" text-anchor="start">Docker network 'proxy' · 172.30.0.0/24</text>
<rect x="386" y="612" width="268" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="402" y="636" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Caddy · 172.30.0.2</text>
<text x="402" y="656" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">TLS on :44300 · exact hostname only</text>
<rect x="386" y="690" width="268" height="58" rx="8" fill="#dbeafe" stroke="#2563eb" stroke-width="2"/>
<text x="402" y="714" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Jellyfin :8096</text>
<text x="402" y="734" font-size="12.5" font-weight="400" fill="#1f2937" text-anchor="start">non-root · media mounted read-only</text>
<rect x="690" y="404" width="250" height="130" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="706" y="428" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">Docker default network</text>
<text x="706" y="448" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Sonarr · Radarr · Prowlarr</text>
<text x="706" y="466" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Jackett · Bazarr · qBittorrent</text>
<text x="706" y="484" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Jellyseerr · Homarr · dashdot</text>
<text x="706" y="502" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">Syncthing · FlareSolverr</text>
<text x="706" y="520" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">LAN / Tailscale access only</text>
<rect x="690" y="572" width="250" height="58" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="706" y="596" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">AdGuard Home</text>
<text x="706" y="616" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">host network · LAN DNS</text>
<rect x="690" y="650" width="250" height="94" rx="8" fill="#ffffff" stroke="#9ca3af" stroke-width="1.25"/>
<text x="706" y="674" font-size="14" font-weight="600" fill="#1f2937" text-anchor="start">systemd timers</text>
<text x="706" y="694" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">DDNS update to DuckDNS · 5 min</text>
<text x="706" y="712" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">UPnP renew on gateway · 30 min</text>
<text x="706" y="730" font-size="12.5" font-weight="400" fill="#4b5563" text-anchor="start">fail2ban log reload · hourly</text>
